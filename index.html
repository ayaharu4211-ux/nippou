<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0F13">
<title>現場日報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151B;
  --bg-deep:#0B0D11;
  --surface:#1B1F27;
  --surface-alt:#232833;
  --line:#2C313C;
  --line-soft:#232833;
  --amber:#FF9F1C;
  --amber-deep:#C97800;
  --cyan:#4FD1C5;
  --ink:#ECE9E2;
  --ink-soft:#8891A0;
  --ink-dim:#5C6270;
  --danger:#FF6B5B;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg-deep);color:var(--ink);font-family:'Noto Sans JP',sans-serif;height:100%;overscroll-behavior-y:none;}
h1,h2,h3,.disp{font-family:'Zen Kaku Gothic New',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
input,select{font-family:inherit;}

.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:
  radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,159,28,.08), transparent 60%),
  radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79,209,197,.06), transparent 55%),
  var(--bg);
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,159,28,.08), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79,209,197,.06), transparent 55%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 28px);
  position:relative;
}

/* header */
.app-header{position:sticky;top:0;z-index:20;background:linear-gradient(160deg,#1A1E27 0%,#0E1015 100%);border-bottom:1px solid var(--line);padding:calc(16px + var(--safe-top)) 18px 15px;}
.app-header .row{display:flex;align-items:baseline;justify-content:space-between;}
.app-header h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.06em;color:var(--ink);}
.app-header h1 .accent{color:var(--amber);}
.app-header .date-badge{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cyan);font-weight:700;letter-spacing:.03em;}
.app-header .sub{margin-top:3px;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em;}
.rule{height:2px;background:linear-gradient(90deg,transparent, var(--amber) 15%, var(--cyan) 55%, transparent 90%);opacity:.55;flex-shrink:0;}

/* main scroll area */
.main{flex:1;overflow-y:auto;padding:18px 14px calc(98px + var(--safe-bottom));-webkit-overflow-scrolling:touch;position:relative;z-index:1;}
.view{display:none;}
.view.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);}
.card h2{margin:0 0 13px;font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.card h2::before{content:'';width:3px;height:13px;background:var(--amber);border-radius:2px;display:inline-block;}
label.field-label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:0 0 7px;letter-spacing:.03em;}
.field{margin-bottom:18px;}
.field:last-child{margin-bottom:0;}

input[type=text],input[type=date],input[type=number],textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-alt);border-radius:11px;padding:12px 13px;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s;}
input::placeholder,textarea::placeholder{color:var(--ink-dim);}
input:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,159,28,.15);}
input[type=date]{color-scheme:dark;}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1.5px solid var(--line);background:var(--surface-alt);border-radius:10px;padding:10px 16px;font-size:14.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;user-select:none;transition:.12s;font-family:'JetBrains Mono',monospace;}
.chip.active{background:var(--amber);border-color:var(--amber);color:#1A1204;box-shadow:0 0 0 3px rgba(255,159,28,.18);}
.manpower-input-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.manpower-input-row input{width:120px;text-align:center;font-weight:700;font-size:19px;font-family:'JetBrains Mono',monospace;}
.manpower-input-row .unit{font-size:12.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.05em;}

.worktype-chip{border:1.5px solid;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;background:transparent;transition:.15s;}
.worktype-chip.active{color:#0D0F13 !important;}

.wt-textarea{width:100%;min-height:78px;resize:vertical;line-height:1.6;}

.save-btn{width:100%;background:linear-gradient(135deg,var(--amber) 0%, var(--amber-deep) 100%);color:#1A1204;border:none;border-radius:13px;padding:16px;font-size:16px;font-weight:900;letter-spacing:.05em;cursor:pointer;margin-top:6px;box-shadow:0 6px 20px rgba(255,159,28,.25);}
.save-btn:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(255,159,28,.2);}

.add-block{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
.add-block button{width:100%;border:1.5px dashed var(--cyan);background:rgba(79,209,197,.08);color:var(--cyan);border-radius:11px;padding:12px;font-weight:700;font-size:13.5px;margin-top:9px;cursor:pointer;letter-spacing:.03em;}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:var(--surface-alt);border:1px solid var(--amber);color:var(--ink);padding:11px 22px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* history */
.toolbar{display:flex;gap:8px;margin-bottom:14px;}
.tbtn{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:11px;font-size:12.5px;font-weight:700;color:var(--cyan);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
.day-group{margin-bottom:18px;}
.day-group .day-title{font-size:12px;font-weight:700;color:var(--ink-soft);margin:0 0 9px 2px;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;text-transform:uppercase;}
.entry-row{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;align-items:center;gap:11px;margin-bottom:8px;}
.entry-row .tag{flex-shrink:0;width:5px;height:38px;border-radius:3px;}
.entry-row .main-info{flex:1;min-width:0;}
.entry-row .site{font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-row .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-row .mp{font-weight:800;font-size:17px;color:var(--amber);flex-shrink:0;font-family:'JetBrains Mono',monospace;}
.entry-row .mp .u{font-size:10.5px;font-weight:700;color:var(--ink-soft);font-family:'Noto Sans JP',sans-serif;}
.del-btn{flex-shrink:0;width:30px;height:30px;border-radius:9px;border:none;background:rgba(255,107,91,.12);color:var(--danger);font-size:15px;font-weight:900;cursor:pointer;}

.empty{text-align:center;padding:60px 20px;color:var(--ink-dim);}
.empty .big{font-size:13px;letter-spacing:.3em;font-family:'JetBrains Mono',monospace;margin-bottom:10px;color:var(--ink-dim);}
.empty p{font-size:13.5px;line-height:1.7;margin:0;color:var(--ink-soft);}

/* period lists */
.period-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;}
.period-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.period-head .range{font-size:13.5px;font-weight:700;color:var(--ink);}
.period-head .range small{display:block;font-weight:500;color:var(--ink-dim);font-size:11px;margin-top:2px;letter-spacing:.02em;}
.period-head .total{font-size:17px;font-weight:800;color:var(--amber);font-family:'JetBrains Mono',monospace;}
.period-head .total .u{font-size:10px;color:var(--ink-soft);font-weight:700;font-family:'Noto Sans JP',sans-serif;}
.period-body{padding:2px 16px 15px;display:none;}
.period-card.open .period-body{display:block;}
.period-card.open .chevron{transform:rotate(180deg);}
.chevron{transition:.2s;color:var(--ink-dim);flex-shrink:0;}
.site-row{padding:11px 0;border-top:1px solid var(--line);}
.site-row:first-child{border-top:none;}
.site-row .site-name{font-weight:700;font-size:14px;color:var(--ink);}
.site-row .site-total{float:right;font-weight:800;color:var(--amber);font-size:14px;font-family:'JetBrains Mono',monospace;}
.site-row .breakdown{font-size:11.5px;color:var(--ink-soft);margin-top:5px;clear:both;line-height:1.9;}
.wt-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;}
.period-footer{border-top:1px solid var(--line);margin-top:8px;padding-top:11px;display:flex;flex-wrap:wrap;gap:7px 16px;font-size:11.5px;color:var(--ink-soft);}
.period-footer b{color:var(--ink);font-family:'JetBrains Mono',monospace;}

/* tab bar */
.tab-bar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:rgba(19,22,29,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-bottom);z-index:30;}
.tab-btn{flex:1;background:none;border:none;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-dim);cursor:pointer;}
.tab-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;}
.tab-btn span{font-size:10.5px;font-weight:700;letter-spacing:.03em;}
.tab-btn.active{color:var(--amber);}
.tab-btn.active svg{filter:drop-shadow(0 0 6px rgba(255,159,28,.5));}

.hint{font-size:11.5px;color:var(--ink-dim);line-height:1.7;margin-top:11px;padding:11px 13px;background:var(--surface-alt);border-radius:11px;border-left:2px solid var(--cyan);}

::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="row">
      <h1>現場<span class="accent">日報</span></h1>
      <div class="date-badge" id="headerDate"></div>
    </div>
    <div class="sub" id="headerSub">今日の作業を記録しましょう</div>
  </div>
  <div class="rule"></div>

  <div class="main">

    <!-- 入力 -->
    <div class="view active" id="view-input">
      <div class="card">
        <h2>基本情報</h2>
        <div class="field">
          <label class="field-label">日付</label>
          <input type="date" id="inDate">
        </div>
        <div class="field">
          <label class="field-label">現場名</label>
          <input type="text" id="inSite" list="siteHistory" placeholder="例: ○○邸新築工事" autocomplete="off">
          <datalist id="siteHistory"></datalist>
        </div>
      </div>

      <div class="card">
        <h2>作業人員(人工)</h2>
        <div class="chip-row" id="manpowerChips"></div>
        <div class="manpower-input-row">
          <input type="number" id="inManpower" step="0.5" min="0" value="1">
          <span class="unit">人工</span>
        </div>
      </div>

      <div class="card">
        <h2>作業内容</h2>
        <div class="chip-row" id="worktypeChips"></div>
        <div class="add-block">
          <label class="field-label">新しい作業内容を追加</label>
          <textarea class="wt-textarea" id="newWorktype" placeholder="例: 外壁補修工事(北面3階)"></textarea>
          <button id="addWorktypeBtn">この内容をタグとして追加</button>
        </div>
      </div>

      <button class="save-btn" id="saveBtn">この内容で保存する</button>
      <div class="hint">端末内に保存されます。機種変更やブラウザのデータ削除に備えて、「履歴」タブから定期的にバックアップの書き出しをおすすめします。</div>
    </div>

    <!-- 履歴 -->
    <div class="view" id="view-history">
      <div class="toolbar">
        <button class="tbtn" id="exportBtn">⭳ バックアップ書き出し</button>
        <button class="tbtn" id="importBtn">⭱ 復元する</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
      <div id="historyList"></div>
    </div>

    <!-- 週 -->
    <div class="view" id="view-week">
      <div id="weekList"></div>
    </div>

    <!-- 月 -->
    <div class="view" id="view-month">
      <div id="monthList"></div>
    </div>

  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="input">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>入力</span>
    </button>
    <button class="tab-btn" data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
      <span>履歴</span>
    </button>
    <button class="tab-btn" data-tab="week">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span>週集計</span>
    </button>
    <button class="tab-btn" data-tab="month">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>
      <span>月集計</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== ストレージ ===== */
const STORE_KEY='genba_nippou_entries_v1';
const WT_KEY='genba_nippou_worktypes_v1';
const DEFAULT_WT=['通常工事','追加工事','補修工事'];
const PALETTE=['#4FD18C','#FF9F1C','#4FD1C5','#B08EF5','#FF6B5B','#F5D76E','#5B9EFF','#FF7CB6'];

function loadEntries(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }catch(e){ return []; }
}
function saveEntries(list){
  localStorage.setItem(STORE_KEY, JSON.stringify(list));
}
function loadWorktypes(){
  try{
    const w = JSON.parse(localStorage.getItem(WT_KEY)||'null');
    return (w && w.length) ? w : DEFAULT_WT.slice();
  }catch(e){ return DEFAULT_WT.slice(); }
}
function saveWorktypes(list){
  localStorage.setItem(WT_KEY, JSON.stringify(list));
}

let entries = loadEntries();
let worktypes = loadWorktypes();
let selectedWorktype = worktypes[0];
let selectedManpower = 1;

function colorForType(name){
  const idx = worktypes.indexOf(name);
  return PALETTE[(idx<0?0:idx) % PALETTE.length];
}

/* ===== ヘッダー日付 ===== */
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const WD=['日','月','火','水','木','金','土'];
function fmtDate(str,withYear){
  const d=new Date(str+'T00:00:00');
  return (withYear?d.getFullYear()+'年':'')+(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';
}
function refreshHeader(){
  document.getElementById('headerDate').textContent = fmtDate(todayStr());
  document.getElementById('headerSub').textContent = entries.length ? `これまでの記録: ${entries.length}件` : '今日の作業を記録しましょう';
}

/* ===== 入力タブ ===== */
const MP_PRESETS=[0.5,1,1.5,2,2.5,3];
function renderManpowerChips(){
  const wrap=document.getElementById('manpowerChips');
  wrap.innerHTML='';
  MP_PRESETS.forEach(v=>{
    const c=document.createElement('div');
    c.className='chip'+(v===selectedManpower?' active':'');
    c.textContent=v;
    c.onclick=()=>{ selectedManpower=v; document.getElementById('inManpower').value=v; renderManpowerChips(); };
    wrap.appendChild(c);
  });
}
document.getElementById('inManpower').addEventListener('input',e=>{
  selectedManpower = parseFloat(e.target.value)||0;
  renderManpowerChips();
});

function renderWorktypeChips(){
  const wrap=document.getElementById('worktypeChips');
  wrap.innerHTML='';
  worktypes.forEach(w=>{
    const color=colorForType(w);
    const c=document.createElement('div');
    const active = w===selectedWorktype;
    c.className='worktype-chip'+(active?' active':'');
    c.style.borderColor=color;
    c.style.color= active ? '#0D0F13' : color;
    c.style.background = active ? color : 'transparent';
    c.textContent=w;
    c.onclick=()=>{ selectedWorktype=w; renderWorktypeChips(); };
    wrap.appendChild(c);
  });
}
document.getElementById('addWorktypeBtn').onclick=()=>{
  const inp=document.getElementById('newWorktype');
  const v=inp.value.trim();
  if(!v) return;
  if(!worktypes.includes(v)){ worktypes.push(v); saveWorktypes(worktypes); }
  selectedWorktype=v;
  inp.value='';
  renderWorktypeChips();
};

function refreshSiteHistory(){
  const dl=document.getElementById('siteHistory');
  const seen=[...new Set(entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>e.site))];
  dl.innerHTML = seen.map(s=>`<option value="${escapeHtml(s)}">`).join('');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('show'),1800);
}

document.getElementById('saveBtn').onclick=()=>{
  const date=document.getElementById('inDate').value || todayStr();
  const site=document.getElementById('inSite').value.trim();
  const mp=parseFloat(document.getElementById('inManpower').value);
  if(!site){ showToast('現場名を入力してください'); document.getElementById('inSite').focus(); return; }
  if(!mp || mp<=0){ showToast('作業人員を入力してください'); return; }
  entries.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), date, site, manpower: mp, worktype: selectedWorktype });
  saveEntries(entries);
  document.getElementById('inSite').value='';
  refreshSiteHistory();
  refreshHeader();
  showToast('保存しました');
  renderHistory(); renderWeek(); renderMonth();
};

/* ===== 履歴タブ ===== */
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderHistory(){
  const list=document.getElementById('historyList');
  if(!entries.length){
    list.innerHTML=`<div class="empty"><div class="big">NO RECORDS</div><p>まだ記録がありません。<br>「入力」タブから最初の日報を保存しましょう。</p></div>`;
    return;
  }
  const byDate={};
  entries.forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e); });
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  list.innerHTML = dates.map(date=>{
    const rows = byDate[date].map(e=>`
      <div class="entry-row">
        <div class="tag" style="background:${colorForType(e.worktype)}"></div>
        <div class="main-info">
          <div class="site">${escapeHtml(e.site)}</div>
          <div class="meta">${escapeHtml(e.worktype)}</div>
        </div>
        <div class="mp">${e.manpower}<span class="u">人工</span></div>
        <button class="del-btn" data-id="${e.id}">×</button>
      </div>`).join('');
    return `<div class="day-group"><div class="day-title">${fmtDate(date,false)}</div>${rows}</div>`;
  }).join('');
  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.onclick=()=>{
      if(!confirm('この記録を削除しますか?')) return;
      entries = entries.filter(e=>e.id!==btn.dataset.id);
      saveEntries(entries);
      refreshHeader(); refreshSiteHistory();
      renderHistory(); renderWeek(); renderMonth();
    };
  });
}

/* ===== 週・月 集計 ===== */
function mondayOf(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay();
  const diff=d.getDate()-day+(day===0?-6:1);
  const m=new Date(d); m.setDate(diff);
  return m;
}
function toKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function buildPeriodGroups(mode){
  const groups={};
  entries.forEach(e=>{
    let key, label, sortKey;
    if(mode==='week'){
      const mon=mondayOf(e.date);
      key=toKey(mon);
      const sun=new Date(mon); sun.setDate(mon.getDate()+6);
      label = `${mon.getMonth()+1}/${mon.getDate()}(月) 〜 ${sun.getMonth()+1}/${sun.getDate()}(日)`;
      sortKey=key;
    }else{
      const d=new Date(e.date+'T00:00:00');
      key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      label = `${d.getFullYear()}年 ${d.getMonth()+1}月`;
      sortKey=key;
    }
    if(!groups[key]) groups[key]={label, sortKey, entries:[]};
    groups[key].entries.push(e);
  });
  return Object.values(groups).sort((a,b)=>b.sortKey.localeCompare(a.sortKey));
}

function renderPeriodList(containerId, mode){
  const container=document.getElementById(containerId);
  const groups=buildPeriodGroups(mode);
  if(!groups.length){
    container.innerHTML=`<div class="empty"><div class="big">NO DATA</div><p>${mode==='week'?'週':'月'}の集計データがまだありません。<br>作業内容を入力すると、ここに自動で集計されます。</p></div>`;
    return;
  }
  container.innerHTML = groups.map((g,i)=>{
    const bySite={};
    let total=0;
    const wtTotals={};
    g.entries.forEach(e=>{
      total+=e.manpower;
      wtTotals[e.worktype]=(wtTotals[e.worktype]||0)+e.manpower;
      if(!bySite[e.site]) bySite[e.site]={total:0, wt:{}};
      bySite[e.site].total+=e.manpower;
      bySite[e.site].wt[e.worktype]=(bySite[e.site].wt[e.worktype]||0)+e.manpower;
    });
    const siteRows = Object.entries(bySite).sort((a,b)=>b[1].total-a[1].total).map(([site,d])=>{
      const bd = Object.entries(d.wt).map(([wt,v])=>
        `<span style="margin-right:10px;"><span class="wt-dot" style="background:${colorForType(wt)}"></span>${escapeHtml(wt)} ${trimNum(v)}</span>`
      ).join('');
      return `<div class="site-row"><span class="site-total">${trimNum(d.total)}人工</span><div class="site-name">${escapeHtml(site)}</div><div class="breakdown">${bd}</div></div>`;
    }).join('');
    const footer = Object.entries(wtTotals).map(([wt,v])=>`<span><span class="wt-dot" style="background:${colorForType(wt)}"></span>${escapeHtml(wt)} <b>${trimNum(v)}</b></span>`).join('');
    return `
    <div class="period-card${i===0?' open':''}" data-idx="${i}">
      <div class="period-head">
        <div class="range">${g.label}<small>${Object.keys(bySite).length}現場・${g.entries.length}件</small></div>
        <div style="display:flex;align-items:center;gap:9px;">
          <div class="total">${trimNum(total)}<span class="u">人工</span></div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="period-body">
        ${siteRows}
        <div class="period-footer">${footer}</div>
      </div>
    </div>`;
  }).join('');
  container.querySelectorAll('.period-head').forEach(h=>{
    h.onclick=()=>h.parentElement.classList.toggle('open');
  });
}
function trimNum(n){ return (Math.round(n*100)/100).toString(); }

function renderWeek(){ renderPeriodList('weekList','week'); }
function renderMonth(){ renderPeriodList('monthList','month'); }

/* ===== バックアップ ===== */
document.getElementById('exportBtn').onclick=()=>{
  const data={ exportedAt:new Date().toISOString(), entries, worktypes };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`現場日報_バックアップ_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('バックアップを書き出しました');
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=(e)=>{
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data.entries)) throw new Error('形式が不正です');
      const mode = confirm('OK: 今のデータに追加して復元\nキャンセル: 今のデータを置き換えて復元');
      if(mode){
        const existingIds=new Set(entries.map(x=>x.id));
        data.entries.forEach(x=>{ if(!existingIds.has(x.id)) entries.push(x); });
      }else{
        entries = data.entries;
      }
      if(Array.isArray(data.worktypes)){
        data.worktypes.forEach(w=>{ if(!worktypes.includes(w)) worktypes.push(w); });
      }
      saveEntries(entries); saveWorktypes(worktypes);
      refreshHeader(); refreshSiteHistory();
      renderHistory(); renderWeek(); renderMonth(); renderWorktypeChips();
      showToast('復元しました');
    }catch(err){
      alert('読み込みに失敗しました。正しいバックアップファイルか確認してください。');
    }
    e.target.value='';
  };
  reader.readAsText(file);
};

/* ===== タブ切り替え ===== */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='history') renderHistory();
    if(btn.dataset.tab==='week') renderWeek();
    if(btn.dataset.tab==='month') renderMonth();
  };
});

/* ===== 初期化 ===== */
document.getElementById('inDate').value = todayStr();
renderManpowerChips();
renderWorktypeChips();
refreshSiteHistory();
refreshHeader();
renderHistory();
</script>
